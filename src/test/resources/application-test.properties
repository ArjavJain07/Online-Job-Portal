spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
# Section 10.7: the tests build their schema from the same Flyway migrations the real
# databases use, and then have Hibernate validate the entity mappings against it. This is
# the whole point of the exercise - a migration that is only ever run in production is a
# migration nobody has tested. `validate` is what turns 392 passing tests into evidence
# that db/migration really does describe the schema the code expects; with create-drop
# here, Hibernate would quietly build its own schema and the migrations would rot unread.
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
app.upload-dir=build/test-uploads
app.seed.demo-data=true
app.demo.show-credentials=false
# JobSweepScheduler's bean is entirely excluded from the context when this is false
# (@ConditionalOnProperty) - a real background tick must never race a test's own
# assertions against the shared seed data (Section 7.11). JobSweepServiceTest calls
# JobSweepService#sweep() directly instead, deterministically, with the fixed test Clock.
app.job-sweep.enabled=false
# JobAlertScheduler excluded the same way and for the same reason (Section 16 future-work
# item 5): a real background tick could otherwise email a digest built from the shared seed
# data between two unrelated tests. Every test that exercises the feature calls
# JobAlertService#sendDueDigests() directly with the fixed test Clock instead
# (JobAlertServiceTest), the same split JobSweepServiceTest already uses.
app.job-alerts.enabled=false
# Fixed, explicit value (matches the application.properties default) so a test can assert
# on the exact unsubscribe link an emailed digest contains, the same way
# PasswordResetFlowTest asserts on the reset link's path.
app.site-base-url=http://localhost:8080
logging.level.com.jobportal=WARN
