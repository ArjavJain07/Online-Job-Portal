<!DOCTYPE html>
<!--
  Chart card (Section 7.1, 7.6): a Chart.js canvas plus a collapsible data table, so every
  chart is still readable with JavaScript off or by a screen reader (Section 7.1
  accessibility rule: "every chart has a data table").

  The data itself is written next to the canvas as a small JSON island
  (<script type="application/json">), using Thymeleaf's JavaScript inlining
  ("[[${...}]]" inside th:inline="javascript"), which is safe here because ChartData only
  ever holds strings and numbers (Section 7.6). The page that uses this fragment reads the
  canvas by its id from its own "scripts" block, for example:
      JobPortalCharts.line('applicationsChart');
  which (per static/js/charts.js) looks for that JSON island automatically.

  "card(id, title, chart)" draws one ChartData series. "multi(id, title, charts)" draws
  several series that share the same labels (one extra table column per series), used for
  example by the E-D5 messages-sent-vs-replies chart.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="card(id, title, chart)" class="card shadow-sm mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span th:text="${title}">Chart title</span>
        <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse"
                th:attr="data-bs-target=${'#' + id + '-table'}, aria-controls=${id + '-table'}"
                aria-expanded="false">
            <i class="bi bi-table"></i> View data
        </button>
    </div>
    <div class="card-body">
        <div class="chart-container">
            <canvas th:id="${id}"></canvas>
            <script type="application/json" th:inline="javascript">[[${chart}]]</script>
        </div>
        <div class="collapse" th:id="${id + '-table'}">
            <table class="chart-data-table table table-sm" th:if="${chart != null and !#lists.isEmpty(chart.labels)}">
                <caption class="visually-hidden" th:text="'Data for ' + ${title}">Data</caption>
                <thead>
                <tr>
                    <th scope="col">Period</th>
                    <th scope="col" th:text="${chart.label}">Value</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rowLabel, iter : ${chart.labels}">
                    <td th:text="${rowLabel}">Label</td>
                    <td th:text="${chart.values.get(iter.index)}">0</td>
                </tr>
                </tbody>
            </table>
            <p class="text-muted small mb-0" th:if="${chart == null or #lists.isEmpty(chart.labels)}">No data yet.</p>
        </div>
    </div>
</div>

<div th:fragment="multi(id, title, charts)" class="card shadow-sm mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span th:text="${title}">Chart title</span>
        <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse"
                th:attr="data-bs-target=${'#' + id + '-table'}, aria-controls=${id + '-table'}"
                aria-expanded="false">
            <i class="bi bi-table"></i> View data
        </button>
    </div>
    <div class="card-body">
        <div class="chart-container">
            <canvas th:id="${id}"></canvas>
            <script type="application/json" th:inline="javascript">[[${charts}]]</script>
        </div>
        <div class="collapse" th:id="${id + '-table'}">
            <table class="chart-data-table table table-sm" th:if="${charts != null and !#lists.isEmpty(charts)}">
                <caption class="visually-hidden" th:text="'Data for ' + ${title}">Data</caption>
                <thead>
                <tr>
                    <th scope="col">Period</th>
                    <th scope="col" th:each="series : ${charts}" th:text="${series.label}">Series</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rowLabel, iter : ${charts[0].labels}">
                    <td th:text="${rowLabel}">Label</td>
                    <td th:each="series : ${charts}" th:text="${series.values.get(iter.index)}">0</td>
                </tr>
                </tbody>
            </table>
            <p class="text-muted small mb-0" th:if="${charts == null or #lists.isEmpty(charts)}">No data yet.</p>
        </div>
    </div>
</div>

</body>
</html>
