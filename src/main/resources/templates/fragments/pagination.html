<!DOCTYPE html>
<!--
  Page links for a Spring Data Page<T> (Section 7.9): Previous, up to 5 page numbers
  centred on the current page, Next, and a "Showing 11-20 of 57" summary. Everything is
  built once by @pageLinks.build(page) (web.support.PageLinks) - which keeps every other
  query parameter (filters, sort, ...) on every link - and bound to "links" with th:with,
  so the rest of this fragment is plain property access with no further bean calls or
  arithmetic (see the note on PageLinks for why that matters here).

  Nothing is shown when there is only one page (or none).
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="pagination(page)" aria-label="Pagination" th:if="${page != null and page.totalPages > 1}"
     th:with="links=${@pageLinks.build(page)}">
    <ul class="pagination justify-content-center flex-wrap">
        <li class="page-item" th:classappend="${!links.hasPrevious} ? 'disabled'">
            <a class="page-link" th:href="${links.previousHref}">Previous</a>
        </li>
        <li class="page-item" th:each="link : ${links.pageLinks}" th:classappend="${link.active} ? 'active'">
            <a class="page-link" th:href="${link.href}" th:text="${link.number + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${!links.hasNext} ? 'disabled'">
            <a class="page-link" th:href="${links.nextHref}">Next</a>
        </li>
    </ul>
    <p class="text-center text-muted small" th:text="${links.rangeSummary}">Showing 11-20 of 57</p>
</nav>
</body>
</html>
