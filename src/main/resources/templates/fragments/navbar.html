<!DOCTYPE html>
<!--
  Top navigation (Section 7.1). Shared by both layouts, so it must work for anonymous
  visitors (public pages) and for every logged-in role (dashboard pages). sec:authorize
  comes from thymeleaf-extras-springsecurity6 and reads the same authorities Spring
  Security already put in the session, so this markup never needs its own "is logged in"
  checks in Java.

  Visual language (Section 7.1 UI pass): a plain white bar (background/border/shadow come
  from the .navbar rule in app.css) that stays visible while the page scrolls
  ("sticky-top"), the brand mark on the left, "Find jobs" just after it, and on the right
  the messages icon with its unread-count dot plus a user menu that opens from a
  ".jp-avatar" initials chip. Every link, count and sec:authorize condition below is
  exactly the one this file had before the restyle - only the surrounding markup/classes
  changed.
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-briefcase-fill me-2" aria-hidden="true"></i><span th:text="${siteName}">JobPortal</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent" aria-controls="navbarContent"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <!-- Middle of the bar: "Find jobs" today: room for more role links later without
                 touching the shell again, as long as they are added here (never removed). -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${currentPath == '/jobs'} ? 'active'" th:href="@{/jobs}">Find jobs</a>
                </li>
            </ul>

            <!-- Anonymous visitor: a plain "Log in" link and a primary "Register" button. -->
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2" sec:authorize="isAnonymous()">
                <li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/login}">Log in</a></li>
                <li class="nav-item"><a class="btn btn-primary btn-sm my-1" th:href="@{/register}">Register</a></li>
            </ul>

            <!-- Logged-in user: unread-messages envelope (employer and seeker only) and the account menu -->
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1" sec:authorize="isAuthenticated()">
                <li class="nav-item" sec:authorize="hasRole('EMPLOYER')">
                    <a class="nav-link position-relative" th:href="@{/employer/messages}" title="Messages" aria-label="Messages">
                        <i class="bi bi-envelope fs-5" aria-hidden="true"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              th:if="${unreadMessageCount != null and unreadMessageCount > 0}"
                              th:text="${unreadMessageCount}">0</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('JOB_SEEKER')">
                    <a class="nav-link position-relative" th:href="@{/seeker/messages}" title="Messages" aria-label="Messages">
                        <i class="bi bi-envelope fs-5" aria-hidden="true"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              th:if="${unreadMessageCount != null and unreadMessageCount > 0}"
                              th:text="${unreadMessageCount}">0</span>
                    </a>
                </li>
                <li class="nav-item dropdown"
                    th:with="initials=${currentUser != null and currentUser.fullName != null and !currentUser.fullName.isEmpty()} ? ${currentUser.fullName.substring(0,1).toUpperCase()} : '?'">
                    <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" id="userMenuToggle" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="jp-avatar" aria-hidden="true" th:text="${initials}">U</span>
                        <span class="d-none d-md-inline" th:text="${currentUser != null ? currentUser.fullName : ''}">User name</span>
                        <span class="badge bg-secondary" th:if="${currentUser != null}"
                              th:text="${currentUser.role.label}">Role</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenuToggle">
                        <li><a class="dropdown-item" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2" aria-hidden="true"></i>My dashboard</a></li>
                        <li><a class="dropdown-item" th:href="@{/account/password}"><i class="bi bi-key me-2" aria-hidden="true"></i>Change password</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3 py-1">
                                <button type="submit" class="btn btn-link dropdown-item p-0"><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Log out</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
