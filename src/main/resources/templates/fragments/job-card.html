<!DOCTYPE html>
<!--
  One job listing (Section 7.1 reusable fragments): used by the landing page, the public
  and seeker job search results, and (later) recommendations. "applied" is a plain boolean
  - true only on /seeker/jobs (M5) for a job the current seeker has already applied to
  (any status, including withdrawn); the public pages in this milestone always pass false,
  so the "Applied" badge never shows there (Section 6.1 P-2: "no Applied badges").
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="card(job, applied)" class="card shadow-sm mb-3">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
            <div>
                <h2 class="h5 mb-1">
                    <a th:href="@{/jobs/{id}(id=${job.id})}" th:text="${job.title}"
                       class="text-decoration-none">Job title</a>
                </h2>
                <p class="text-muted mb-0">
                    <span th:text="${job.employer.companyName}">Company</span>
                    &middot;
                    <span th:text="${job.location}">Location</span>
                </p>
            </div>
            <span class="badge app-applied" th:if="${applied}">Applied</span>
        </div>

        <div class="mb-2">
            <span class="badge text-bg-light border me-1" th:text="${job.jobType.label}">Full-time</span>
            <span class="badge text-bg-light border" th:text="${job.workMode.label}">Remote</span>
        </div>

        <p class="mb-1 fw-semibold" th:text="${@fmt.salaryRange(job)}">INR 6,00,000 - 9,00,000 per year</p>

        <p class="text-muted small mb-0">
            Posted <span th:text="${@fmt.ago(job.approvedAt)}">3 days ago</span>
            &middot;
            Apply by <span th:text="${#temporals.format(job.applicationDeadline, 'dd MMM yyyy')}">11 Oct 2026</span>
        </p>
    </div>
</div>

</body>
</html>
