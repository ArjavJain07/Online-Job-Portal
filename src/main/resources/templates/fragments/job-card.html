<!DOCTYPE html>
<!--
  One job listing (Section 7.1 reusable fragments): used by the landing page, the public
  and seeker job search results, and (later) recommendations. "applied" is a plain boolean
  - true only on /seeker/jobs (M5) for a job the current seeker has already applied to
  (any status, including withdrawn); the public pages in this milestone always pass false,
  so the "Applied" badge never shows there (Section 6.1 P-2: "no Applied badges").

  Job-site convention (Section 7.1 core rule 6): a square ".jp-logo" mark with the
  company's first initial, the title as a blue ".job-title" link, company then location on
  their own lines, salary in bold, small ".jp-chip" pills for job type and work mode, and
  posted-ago in muted text. Every value bound below (job.title, employer.companyName,
  location, salaryRange, jobType/workMode label, ago, deadline, applied) is unchanged from
  before the restyle - only the layout and classes changed.

  IMPORTANT - the outer class string must keep the literal substring
  "card shadow-sm mb-3" intact and in that order: JobSearchTest#assertAppliedBadge splits
  the whole page on that exact text to isolate one job's card before checking whether it
  contains "app-applied", so "job-card" is appended after it rather than replacing it.

  Signature is still exactly "card(job, applied)" - unchanged, so every existing caller
  (public/index.html, public/jobs.html, seeker/jobs.html) keeps working with no edits. The
  two-pane jobs page (Section 7.1 core rule 7: ".job-card.is-selected") does not need a
  third parameter either: a page that wants one card marked selected just adds the plain
  model attribute "selectedJobId" (a Long); this fragment appends ".is-selected" itself
  when a job's id matches it, and does nothing when the attribute is absent (the normal
  case on every page above), because th:with reads a missing model attribute as null.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="card(job, applied)" class="card shadow-sm mb-3 job-card"
     th:with="isSelected=${selectedJobId != null and job != null and selectedJobId == job.id}"
     th:classappend="${isSelected} ? 'is-selected'">
    <div class="d-flex gap-3">
        <span class="jp-logo" aria-hidden="true"
              th:text="${job.employer.companyName.substring(0,1).toUpperCase()}">C</span>

        <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                <h2 class="h5 mb-1">
                    <a th:href="@{/jobs/{id}(id=${job.id})}" th:text="${job.title}" class="job-title">Job title</a>
                </h2>
                <span class="badge app-applied" th:if="${applied}">Applied</span>
            </div>

            <p class="job-company mb-0" th:text="${job.employer.companyName}">Company</p>
            <p class="job-meta mb-2" th:text="${job.location}">Location</p>

            <p class="job-salary mb-2" th:text="${@fmt.salaryRange(job)}">INR 6,00,000 - 9,00,000 per year</p>

            <div class="mb-2 d-flex flex-wrap gap-1">
                <span class="jp-chip" th:text="${job.jobType.label}">Full-time</span>
                <span class="jp-chip" th:text="${job.workMode.label}">Remote</span>
            </div>

            <p class="job-meta mb-0">
                Posted <span th:text="${@fmt.ago(job.approvedAt)}">3 days ago</span>
                &middot;
                Apply by <span th:text="${#temporals.format(job.applicationDeadline, 'dd MMM yyyy')}">11 Oct 2026</span>
            </p>
        </div>
    </div>
</div>

</body>
</html>
