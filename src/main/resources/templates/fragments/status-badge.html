<!DOCTYPE html>
<!--
  Status badges (Section 7.1: "text always accompanies colour"). Two fragments:

  "job(job)" takes a whole Job entity (not a status string) because the colour and label
  shown to a viewer is the COMPUTED display status (Live / Expired / Hidden / Pending
  approval / Rejected / Closed, Section 5.5), which depends on today's date and the
  employer's enabled flag, not only on the stored JobStatus. The css classes
  (job-live, job-expired, ...) already exist in app.css.

  "application(status, audience)" takes the stored ApplicationStatus plus who is looking:
  employers and admins see the plain label ("Rejected"), seekers see the softer one
  ("Not selected"), Section 5.6.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<span th:fragment="job(job)"
      th:with="status=${job.displayStatus(T(java.time.LocalDate).now())}"
      th:switch="${status.name()}">
    <span th:case="'LIVE'"             class="badge job-live"    th:text="${status.label}">Live</span>
    <span th:case="'EXPIRED'"          class="badge job-expired" th:text="${status.label}">Expired</span>
    <span th:case="'HIDDEN'"           class="badge job-hidden"  th:text="${status.label}">Hidden</span>
    <span th:case="'PENDING_APPROVAL'" class="badge job-pending" th:text="${status.label}">Pending approval</span>
    <span th:case="'REJECTED'"         class="badge job-rejected" th:text="${status.label}">Rejected</span>
    <span th:case="'CLOSED'"           class="badge job-closed"  th:text="${status.label}">Closed</span>
</span>

<span th:fragment="application(status, audience)"
      th:with="text=${audience == 'SEEKER'} ? ${status.seekerLabel} : ${status.label}"
      th:switch="${status.name()}">
    <span th:case="'APPLIED'"       class="badge app-applied"       th:text="${text}">Applied</span>
    <span th:case="'UNDER_REVIEW'"  class="badge app-under-review"  th:text="${text}">Under review</span>
    <span th:case="'SHORTLISTED'"   class="badge app-shortlisted"   th:text="${text}">Shortlisted</span>
    <span th:case="'INTERVIEW'"     class="badge app-interview"     th:text="${text}">Interview</span>
    <span th:case="'HIRED'"         class="badge app-hired"         th:text="${text}">Hired</span>
    <span th:case="'REJECTED'"      class="badge app-rejected"      th:text="${text}">Not selected</span>
    <span th:case="'WITHDRAWN'"     class="badge app-withdrawn"     th:text="${text}">Withdrawn</span>
</span>

</body>
</html>
