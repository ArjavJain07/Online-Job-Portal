<!DOCTYPE html>
<!--
  Change password page (Section 6.1 P-5). Uses layout/dashboard.html (Section 7.1: this
  is one of the two pages outside /admin, /employer, /seeker that still use the dashboard
  layout) so any logged-in role reaches it from the navbar's "Change password" link and
  keeps their own sidebar.
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/dashboard :: layout(title='Change Password', content=~{::main}, scripts=~{})}">
<body>
<main>
    <!-- Section 7.1 page-head pattern (h1 + one muted sentence); no primary action here,
         so the right-hand slot of .jp-page-head is simply omitted. -->
    <div class="jp-page-head">
        <div>
            <h1 class="h3 mb-1">Change password</h1>
            <p>Update the password you use to log in.</p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="@{/account/password}" th:object="${changePasswordForm}" method="post" novalidate>

                        <!-- A refused business rule (wrong current password, or the new
                             one matching the old one) shows here as a global form error
                             (Section 7.2: result.reject("businessRule", ...)). #fields
                             only resolves inside the th:object scope, so this must sit
                             inside the <form>, not before it. -->
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error message.</span>
                        </div>

                        <div class="mb-3">
                            <label for="currentPassword" class="form-label required">Current password</label>
                            <input type="password" class="form-control" id="currentPassword" th:field="*{currentPassword}"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{currentPassword}">Current password error.</div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label required">New password</label>
                            <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                            <div class="form-text">8-64 characters, at least one letter and one digit, no spaces.</div>
                            <div class="invalid-feedback" th:errors="*{newPassword}">New password error.</div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label required">Confirm new password</label>
                            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                                   th:classappend="${#fields.hasErrors('passwordsMatching')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{passwordsMatching}">Passwords do not match.</div>
                        </div>

                        <button type="submit" class="btn btn-primary">Change password</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
