<!DOCTYPE html>
<!--
  M1 placeholder only (Section 11.2): just needs to exist, on the shared dashboard layout
  with the employer sidebar, so a seeded employer account has somewhere to land after
  login. Milestone M7 replaces this with the real employer dashboard (KPIs, recent
  applications, recommendations link, statistics chart).

  EmployerDashboardController passes no model attributes of its own, only the global ones
  from GlobalModelAttributes (currentUser, siteName, announcement, currentPath,
  unreadMessageCount), so this page uses only those.
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/dashboard :: layout(title='Employer Dashboard', content=~{::main}, scripts=~{})}">
<body>
<main>
    <div class="jp-page-head">
        <div>
            <h1 class="h3 mb-1">Employer Dashboard</h1>
            <p>
                Welcome back, <span th:text="${currentUser != null ? currentUser.fullName : 'there'}">Employer</span>.
                <span class="badge bg-secondary ms-1" th:if="${currentUser != null}" th:text="${currentUser.role.label}">Employer</span>
            </p>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body empty-state">
            <i class="bi bi-cone-striped icon"></i>
            <p class="message">
                This is a placeholder page (Section 11.2). The full employer dashboard - KPIs,
                recent applications and the applications chart - is built in <strong>Milestone M7</strong>.
                In the meantime, use the sidebar to post and manage jobs.
            </p>
        </div>
    </div>
</main>
</body>
</html>
