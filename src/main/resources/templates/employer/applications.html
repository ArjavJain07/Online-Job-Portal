<!DOCTYPE html>
<!--
  Employer application list (Section 6.3 E-D2). EmployerApplicationController#list puts
  the Spring Data Page under "page" (read by fragments/pagination), the employer's own
  jobs (every status, including closed - Section 6.3 E-D2) under "ownJobs" for the jobId
  select, the two effective filter values under "jobId"/"status" so the filter bar keeps
  whatever was submitted (an unrecognised or foreign value the service already fell back
  to "no filter" for, Section 7.9), the full status list under "statuses" (an enum can't
  be looped with T(...) in the template, Section 7.1 note), and per-application unread
  message counts under "unreadCounts".
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/dashboard :: layout(title='Applications', content=~{::main}, scripts=~{})}">
<body>
<main>
    <div class="jp-page-head mb-3">
        <div>
            <h1 class="h3 mb-1">Applications</h1>
            <p>Review and manage everyone who applied to your jobs.</p>
        </div>
    </div>

    <form method="get" th:action="@{/employer/applications}" class="jp-filters card mb-4">
        <div class="card-header">
            <span><i class="bi bi-funnel me-2" aria-hidden="true"></i>Filter applications</span>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="filter-job">Job</label>
                    <select class="form-select" id="filter-job" name="jobId">
                        <option value="" th:selected="${jobId == null}">All jobs</option>
                        <option th:each="j : ${ownJobs}" th:value="${j.id}" th:text="${j.title}"
                                th:selected="${jobId != null and jobId == j.id}">Job title</option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="filter-status">Status</label>
                    <select class="form-select" id="filter-status" name="status">
                        <option value="ALL" th:selected="${status == 'ALL'}">Any</option>
                        <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"
                                th:selected="${status == s.name()}">Status</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="card-footer d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-funnel" aria-hidden="true"></i> Filter</button>
            <a th:href="@{/employer/applications}" class="btn btn-outline-secondary">Clear filters</a>
        </div>
    </form>

    <div th:if="${page.empty}" class="card shadow-sm">
        <div class="card-body empty-state">
            <i class="bi bi-file-earmark-person icon"></i>
            <p class="message">No applications match these filters.</p>
        </div>
    </div>

    <div th:unless="${page.empty}" class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Reference</th>
                    <th>Candidate</th>
                    <th>Job</th>
                    <th>Applied on</th>
                    <th>Status</th>
                    <th class="numeric">Unread</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <!-- Compact row: an initials chip stands in for a photo next to the candidate's
                     name (same ".jp-avatar" hook the navbar uses for the signed-in user), the
                     status pill always carries its own word (never colour alone), and the row
                     ends with the one quick action this list offers - the full review happens
                     on the application detail page. -->
                <tr th:each="a : ${page.content}"
                    th:with="initials=${a.seeker.fullName != null and !a.seeker.fullName.isEmpty()} ? ${a.seeker.fullName.substring(0,1).toUpperCase()} : '?'">
                    <td th:text="${a.reference}">APP-00001</td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <span class="jp-avatar" aria-hidden="true" th:text="${initials}">C</span>
                            <span>
                                <span th:text="${a.seeker.fullName}">Candidate name</span>
                                <span th:unless="${a.seeker.enabled}" class="badge text-bg-secondary ms-1">Account deactivated</span>
                            </span>
                        </div>
                    </td>
                    <td>
                        <a th:href="@{/employer/jobs/{id}(id=${a.job.id})}" th:text="${a.job.title}">Job title</a>
                    </td>
                    <td th:text="${#temporals.format(a.appliedAt, 'dd MMM yyyy')}">16 Sep 2026</td>
                    <td>
                        <!-- fragments/status-badge has no "New" case of its own, so the E-D2 override
                             (Section 6.3: "Status badge ('New' for APPLIED)") is built here instead,
                             reusing the same app-applied colour class; every other status still goes
                             through the shared fragment (11.3 contract item 9). -->
                        <span th:if="${a.status.name() == 'APPLIED'}" class="badge app-applied">New</span>
                        <th:block th:unless="${a.status.name() == 'APPLIED'}">
                            <span th:replace="~{fragments/status-badge :: application(${a.status}, 'EMPLOYER')}"></span>
                        </th:block>
                    </td>
                    <td class="numeric">
                        <span th:if="${unreadCounts.get(a.id) != null}" class="badge bg-danger"
                              th:text="${unreadCounts.get(a.id)}">1</span>
                        <span th:unless="${unreadCounts.get(a.id) != null}" class="text-muted">-</span>
                    </td>
                    <td>
                        <a th:href="@{/employer/applications/{id}(id=${a.id})}" class="btn btn-sm btn-outline-secondary">View</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/pagination :: pagination(${page})}"></div>
</main>
</body>
</html>
