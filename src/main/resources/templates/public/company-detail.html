<!DOCTYPE html>
<!--
  Public company detail page (Section 6.1 P-4 A-D6): shows the employer's company profile
  (name, description, website) and all of their currently visible jobs in a list view.
  The layout uses the same "main + sidebar" structure as the job detail page, with the
  company info in the sidebar and the jobs list in the main column.
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/public :: layout(title=${company.companyName}, content=~{::main}, scripts=~{})}">
<body>
<main>
    <p class="mb-3">
        <a th:href="@{/companies}" class="text-decoration-none">
            <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back to companies
        </a>
    </p>

    <!-- Main column plus sidebar (same layout as job-detail.html), stacks below on narrower screens -->
    <div class="jp-layout-wide">
        <div>

            <!-- Company info header card -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <div class="d-flex gap-3 mb-3">
                        <span class="jp-logo" aria-hidden="true"
                              th:text="${company.companyName.substring(0,1).toUpperCase()}">C</span>
                        <div>
                            <h1 class="h3 mb-2" th:text="${company.companyName}">Company name</h1>
                            <p class="text-muted mb-0" th:if="${!#strings.isEmpty(company.companyWebsite)}">
                                <a th:href="${company.companyWebsite}" th:text="${company.companyWebsite}"
                                   target="_blank" rel="noopener">https://example.com</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Company description card -->
            <div class="card shadow-sm mb-4">
                <div class="card-header">About the company</div>
                <div class="card-body">
                    <p class="pre-line mb-0" th:if="${!#strings.isEmpty(company.companyDescription)}"
                       th:text="${company.companyDescription}">Company description</p>
                    <p th:if="${#strings.isEmpty(company.companyDescription)}" class="text-muted mb-0">
                        No company description yet.
                    </p>
                </div>
            </div>

            <!-- Open positions card -->
            <div class="card shadow-sm mb-4">
                <div class="card-header">Open positions</div>
                <div class="card-body">
                    <div th:if="${jobs.isEmpty()}" class="alert alert-info mb-0">
                        No open positions at the moment.
                    </div>

                    <div th:if="${!jobs.isEmpty()}">
                        <div th:each="job : ${jobs}">
                            <!-- Reuse the job-card fragment for consistent styling and layout -->
                            <div th:replace="~{fragments/job-card :: card(${job}, false)}"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Sidebar with additional company info -->
        <div class="jp-rail">
            <div class="card shadow-sm">
                <div class="card-header">Company overview</div>
                <div class="card-body small">
                    <dl class="row">
                        <dt class="col-sm-6">Open positions</dt>
                        <dd class="col-sm-6" th:text="|${jobs.size()} ${jobs.size() == 1 ? 'job' : 'jobs'}|">1 job</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

</main>
</body>
</html>
