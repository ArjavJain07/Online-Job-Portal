<!DOCTYPE html>
<!--
  Shown for GET and POST of /register/seeker or /register/employer when that role's
  registration setting is off (Section 4.3): nothing is created, only this page is
  rendered. AuthController sets the "message" model attribute to the exact wording for
  the role that was closed.
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/public :: layout(title='Registration Closed', content=~{::main}, scripts=~{})}">
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body empty-state">
                    <i class="bi bi-door-closed icon"></i>
                    <!-- This card is the whole page (Section 7.1 heading scale: one h1 per
                         page), so the empty-state's own optional heading slot (app.css
                         ".empty-state .empty-title") carries it instead of a page-head h1
                         sitting above an otherwise-empty page. -->
                    <h1 class="empty-title">Registration closed</h1>
                    <p class="message" th:text="${message}">Registration is currently closed. Please check back later.</p>
                    <div class="action">
                        <a class="btn btn-primary" th:href="@{/login}">Log in</a>
                        <a class="btn btn-outline-secondary" th:href="@{/}">Back to home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
