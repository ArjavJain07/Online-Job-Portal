<!DOCTYPE html>
<!--
  Reset-password page (Section 16 #1, hard requirement 4). Reached only from the link
  emailed by /forgot-password. tokenInvalid covers every reason the link might not work -
  never issued, already used, expired, or hand-edited - with one identical message
  (PasswordResetController): naming which of those is true would not help a visitor (the
  fix is the same regardless - request a new link) and would only hand a guesser
  information for free, the same "do not say more than necessary" rule the forgot-password
  page follows.
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/public :: layout(title='Reset Password', content=~{::main}, scripts=~{})}">
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

            <div class="card shadow-sm" th:if="${tokenInvalid}">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3">Link no longer valid</h1>
                    <p>This password reset link is invalid or has expired. Reset links can only be used once.</p>
                    <a th:href="@{/forgot-password}" class="btn btn-primary">Request a new link</a>
                </div>
            </div>

            <div class="card shadow-sm" th:unless="${tokenInvalid}">
                <div class="card-body p-4">
                    <h1 class="h3 mb-1">Choose a new password</h1>
                    <p class="text-muted mb-4">Enter a new password for your account.</p>

                    <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post" novalidate>
                        <input type="hidden" th:field="*{token}">

                        <div class="mb-3">
                            <label for="newPassword" class="form-label required">New password</label>
                            <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" autofocus>
                            <div class="form-text">8-64 characters, at least one letter and one digit, no spaces.</div>
                            <div class="invalid-feedback" th:errors="*{newPassword}">New password error.</div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label required">Confirm new password</label>
                            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                                   th:classappend="${#fields.hasErrors('passwordsMatching')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{passwordsMatching}">Passwords do not match.</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Reset password</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>
</body>
</html>
