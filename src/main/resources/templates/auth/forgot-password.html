<!DOCTYPE html>
<!--
  Forgot-password page (Section 16 #1, hard requirement 4). POST always shows the exact
  same confirmation banner whether or not the email matches a real, enabled account - see
  PasswordResetController and PasswordResetService for why: this is the page Section 4.10
  warned a careless password-reset feature would turn into an account-existence oracle,
  and it must not become one. The flash banner itself comes from fragments/flash ::
  messages (already included by layout/public), the same "success" key every other
  Post/Redirect/Get flow in this app uses - no bespoke ?sent-style query flag, because a
  flash attribute already disappears after one render with no extra code.
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/public :: layout(title='Forgot Password', content=~{::main}, scripts=~{})}">
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-1">Forgot your password?</h1>
                    <p class="text-muted mb-4">
                        Enter the email address on your account. If it matches an account, we'll email a link to
                        reset your password.
                    </p>

                    <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label required">Email</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" autofocus
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{email}">Email error.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send reset link</button>
                    </form>

                    <p class="text-center text-muted mt-3 mb-0">
                        <a th:href="@{/login}">Back to log in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
