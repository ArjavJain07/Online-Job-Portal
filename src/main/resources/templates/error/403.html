<!DOCTYPE html>
<!--
  403 Forbidden (Section 7.1, 7.3): shown when a logged-in user's role does not allow the
  URL zone they tried to open (Spring Security's AccessDeniedException). Error pages use
  NO layout and NO model attributes from GlobalModelAttributes - that advice never runs
  for a request handled by Spring Boot's error machinery - so this page is entirely
  self-contained: its own <head>, Bootstrap from the webjar, and a fixed site name.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access denied | JobPortal</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <i class="bi bi-shield-lock text-danger" style="font-size: 3.5rem;"></i>
            <h1 class="h3 mt-3">Access denied</h1>
            <p class="text-muted">Access denied. You don't have permission to open this page.</p>
            <a class="btn btn-primary" th:href="@{/dashboard}">Go to my dashboard</a>
            <a class="btn btn-link" th:href="@{/}">Back to the home page</a>
        </div>
    </div>
</div>
</body>
</html>
