<!DOCTYPE html>
<!--
  500 Internal Server Error (Section 7.1, 7.3): any exception the application did not
  expect and did not catch. Deliberately shows no stack trace to the visitor (that goes
  to the console log only). Self-contained, like every page under templates/error/ - see
  the comment in error/403.html.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong | JobPortal</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card text-center">
                <div class="card-body p-5">
                    <i class="bi bi-exclamation-triangle jp-icon-xl is-danger" aria-hidden="true"></i>
                    <h1 class="h3 mt-3">Something went wrong</h1>
                    <p class="text-muted">Something went wrong. Please try again. If it keeps happening, tell the administrator.</p>
                    <div class="d-flex justify-content-center flex-wrap gap-2 mt-3">
                        <a class="btn btn-primary" th:href="@{/dashboard}">Go to my dashboard</a>
                        <a class="btn btn-link" th:href="@{/}">Back to the home page</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
