<!DOCTYPE html>
<!--
  404 Not Found (Section 7.1, 7.3): missing id, another user's record, an unknown URL for

  every page under templates/error/ - see the comment in error/403.html.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found | JobPortal</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <i class="bi bi-signpost-split text-secondary" style="font-size: 3.5rem;"></i>
            <h1 class="h3 mt-3">Page not found</h1>
            <p class="text-muted">Page not found. The page or record you asked for doesn't exist or isn't available to you.</p>
            <a class="btn btn-primary" th:href="@{/dashboard}">Go to my dashboard</a>
            <a class="btn btn-link" th:href="@{/}">Back to the home page</a>
        </div>
    </div>
</div>

</html>
