<!DOCTYPE html>
<!--
  M1 placeholder only (Section 11.2): just needs to exist, on the shared dashboard layout
  with the job seeker sidebar, so a seeded job seeker account has somewhere to land after
  login. Milestone M7 replaces this with the real seeker dashboard (application summary,
  recommended jobs).

  SeekerDashboardController passes no model attributes of its own, only the global ones
  from GlobalModelAttributes (currentUser, siteName, announcement, currentPath,
  unreadMessageCount), so this page uses only those.
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/dashboard :: layout(title='Job Seeker Dashboard', content=~{::main}, scripts=~{})}">
<body>
<main>
    <h1 class="h3 mb-1">Job Seeker Dashboard</h1>
    <p class="text-muted mb-4">
        Welcome back, <span th:text="${currentUser != null ? currentUser.fullName : 'there'}">Job Seeker</span>.
        <span class="badge bg-secondary ms-1" th:if="${currentUser != null}" th:text="${currentUser.role.label}">Job Seeker</span>
    </p>

    <div class="card shadow-sm">
        <div class="card-body empty-state">
            <i class="bi bi-cone-striped icon"></i>
            <p class="message">
                This is a placeholder page (Section 11.2). The full seeker dashboard - your
                application summary and jobs recommended for you - is built in <strong>Milestone M7</strong>.
                In the meantime, use the sidebar to find and apply for jobs.
            </p>
        </div>
    </div>
</main>
</body>
</html>
