# ---------- Application ----------
spring.application.name=online-job-portal
server.port=${PORT:8080}

# ---------- Database: H2 file database in ./data (no install needed, survives restarts) ----------
spring.datasource.url=jdbc:h2:file:./data/jobportal;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# ---------- H2 web console (admin only, see SecurityConfig) ----------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---------- Schema migrations: Flyway owns the schema (Section 10.7) ----------
# Flyway runs db/migration before Hibernate starts, on every profile and every
# database. One directory serves both H2 and PostgreSQL; V1's header explains why that
# is possible and 10.7 records the alternatives that were rejected.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Adopt, do not rebuild. Both live databases - the hosted Render PostgreSQL one and a
# developer's ./data/jobportal H2 file - already contain every table in V1, created by
# the ddl-auto=update this change replaces, and full of rows. Without this flag Flyway
# would find a non-empty database with no flyway_schema_history table, refuse to guess,
# and abort start-up; with it, Flyway writes a baseline row at version 1 meaning "this
# database is already at V1" and applies only V2 and later. A brand-new database is
# empty, so the flag does not apply there and V1 runs normally.
#
# The flag is therefore harmless to keep on permanently, and keeping it on is what
# makes a fresh checkout and a two-year-old database behave the same.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema as built by ddl-auto=update

# ---------- JPA / Hibernate ----------
# `validate` instead of `update` (Section 10.7). Hibernate no longer changes the
# schema; it only checks at start-up that the schema Flyway produced still matches the
# entity mappings, and refuses to start if it does not. That converts the whole class of
# silent failures 10.4 warned about - ddl-auto=update never drops a column, never
# renames one and never updates an enum constraint, and only logs the problems it hits -
# into one loud error at the only moment it can still be dealt with cheaply.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
# SQL review (M8): logging.level.org.hibernate.SQL=DEBUG

# ---------- Uploads (the app-level limit is the maxResumeSizeMb setting) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=-1
app.upload-dir=./uploads

# ---------- Session and error pages ----------
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Login lockout (Section 4.10) ----------
# Consecutive wrong passwords that lock one account, and how long the cooldown lasts.
# Security policy, so it lives here and not in the admin-editable SystemSettings row -
# see LockoutProperties for the reasoning. Per-IP throttling is nginx's job (limit_req):
# only the proxy sees an address the client cannot forge.
app.lockout.max-attempts=5
app.lockout.cooldown-minutes=15

# ---------- Seed data ----------
app.seed.demo-data=true
app.seed.admin-email=admin@jobportal.local
app.seed.admin-password=Admin@123
app.demo.show-credentials=true

# ---------- Scheduled job sweep: auto-close expired/filled jobs (Section 7.11) ----------
# interval-ms also sets the delay before the FIRST run (JobSweepScheduler), so a freshly
# reset-demo.bat'd app has time to show its seeded Expired/Hidden jobs before the sweep
# can close any of them.
app.job-sweep.enabled=true
app.job-sweep.interval-ms=3600000

# ---------- Outgoing email (Section 16 #1): OFF by default ----------
# Hard requirement 2: this machine, the whole test suite and the live server all have no
# SMTP configured right now, and that must keep working exactly as before. With
# app.mail.enabled=false, NoOpMailService is the active MailService bean and every
# notification email becomes one log line (see that class). Real delivery
# (SmtpMailService) only turns on where an operator explicitly sets app.mail.enabled=true
# together with the spring.mail.* properties - application-prod.properties, never here,
# and never with an invented value that looks like a real credential.
app.mail.enabled=false
app.mail.from=noreply@jobportal.local

# How long an emailed password-reset link stays usable (Section 16 #1, PasswordResetProperties).
app.password-reset.token-expiry-minutes=60

# ---------- Logging ----------
logging.level.com.jobportal=INFO
