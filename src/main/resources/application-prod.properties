# ---------------------------------------------------------------------------
# Hosted profile (Render). Switched on with SPRING_PROFILES_ACTIVE=prod.
# Everything here comes from environment variables that render.yaml fills in,
# so no password is ever written into the repository.
# Local development does not use this file: it keeps the H2 defaults in
# application.properties.
# ---------------------------------------------------------------------------

# ---------- Database: Render Postgres ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ---------- Schema migrations (Section 10.7) ----------
# Flyway and ddl-auto=validate are already set in application.properties and apply here
# unchanged; this profile deliberately does NOT override them, so the hosted database is
# migrated by exactly the SQL the local database and the test suite were migrated by.
# Before this change, `prod` repeated ddl-auto=update and the hosted schema was whatever
# Hibernate happened to do on start-up, with its errors only logged.
#
# The first deploy after this change lands on a database that already has every table
# from V1, built by that old ddl-auto=update. spring.flyway.baseline-on-migrate makes
# Flyway adopt it at version 1 rather than try to create tables that are already there.
# docs/PROJECT_PLAN.md 10.7 lists the one check to run against the hosted database first.
#
# Render sets autoDeployTrigger: commit, so this takes effect on the next push to main.
# If Flyway or validate finds a problem the service fails its health check and Render
# keeps the previous version running - which is the desired outcome: a schema mismatch
# should stop a deploy, not half-apply itself to a database holding real rows.
#
# Stated explicitly rather than left to the default, because Render's Logs tab is the
# only place anyone can see what happened to the hosted schema: these lines are the
# record of which migrations a given deploy applied, and whether the database was
# adopted at the baseline or built from scratch (docs/DEPLOY.md).
logging.level.org.flywaydb=INFO

# The H2 console must never be reachable on a public site.
spring.h2.console.enabled=false

# ---------- Behind Render's HTTPS proxy ----------
# Render terminates TLS and forwards the request over plain HTTP, so Spring has
# to read the X-Forwarded-* headers; without this, every redirect would send the
# visitor from https:// back to http://.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------- Uploads ----------
# A free Render instance has no persistent disk: its filesystem is wiped on
# every restart and redeploy. Resumes therefore live in /tmp and are treated as
# throwaway. The app already shows a friendly message when a stored file has
# gone missing, so a restart never produces an error page.
app.upload-dir=/tmp/uploads

# ---------- Demo data ----------
# The hosted copy is a demonstration, so it seeds the same dataset as the local
# run. The admin password comes from the environment (render.yaml generates one)
# instead of the built-in default.
app.seed.demo-data=true
app.seed.admin-email=${ADMIN_EMAIL:admin@jobportal.local}
app.seed.admin-password=${ADMIN_PASSWORD}
app.demo.show-credentials=${SHOW_DEMO_CREDENTIALS:true}

# ---------- Outgoing email (Section 16 #1) - OFF unless explicitly turned on ----------
# Unlike the database block above, every one of these has a safe fallback. The hosted
# service is live right now with no SMTP configured at all (hard requirement 2), and this
# change must not require a redeploy to add new environment variables just to keep
# working - app.mail.enabled stays false, and the four spring.mail.* values stay empty,
# until an operator deliberately sets them.
#
# To turn on real email: set MAIL_ENABLED=true and the four SMTP_* values under the
# service's Environment tab in the Render dashboard (render.yaml lists them with
# sync: false so Render prompts for them there instead of a value ever being written into
# this repository - hard requirement 1). MAIL_FROM is optional and falls back to the SMTP
# username, which several providers require the From header to match anyway.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${SMTP_USERNAME:noreply@jobportal.local}}

logging.level.com.jobportal=INFO
