plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jobportal'
version = '1.0.0'
description = 'Online Job Portal - Admin, Employer and Job Seeker dashboards'

java {
    // Compiled for Java 17 so the project runs on any JDK 17 or newer.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // ---------- Outgoing email (Section 16 #1) ----------
    // Brings JavaMailSender and its auto-configuration, which only ever creates a real
    // JavaMailSenderImpl bean once spring.mail.host is set (see application-prod.properties).
    // SmtpMailService is the only class that depends on JavaMailSender directly; every other
    // class depends on this project's own MailService interface (hard requirement 2).
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // ---------- Schema migrations (Section 10.7) ----------
    // Flyway replaces spring.jpa.hibernate.ddl-auto=update as the thing that owns the
    // schema. Versions come from the Spring Boot BOM, so they stay in step with Boot.
    //
    // Two artefacts, not one. Since Flyway 10 the core jar only carries the databases
    // Flyway calls "built in"; H2 is one of them, PostgreSQL is not. Without
    // flyway-database-postgresql, Flyway starts happily on H2 and then fails on the
    // production Render database with "Unsupported Database: PostgreSQL" - a failure that
    // would only ever appear in production, which is exactly the class of bug Section 10.7
    // is trying to remove. It is runtimeOnly because no Java code imports it.
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Front-end libraries packaged as jars so the app works offline (no CDN needed)
    implementation 'org.webjars:webjars-locator-lite'
    implementation 'org.webjars:bootstrap:5.3.3'
    implementation 'org.webjars.npm:bootstrap-icons:1.11.3'
    implementation 'org.webjars.npm:chart.js:4.4.1'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'   // used by the hosted (Render) deployment

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    enabled = false   // build only the runnable Spring Boot jar (no confusing *-plain.jar)
}
