# Render blueprint: one web service built from the Dockerfile, plus a Postgres
# database. In Render, choose New > Blueprint and point it at this repository;
# Render reads this file and creates both.
#
# Free tier notes (see docs/DEPLOY.md):
#   - the web service sleeps after 15 minutes idle and takes about a minute to
#     wake up on the next visit
#   - the free database expires 30 days after it is created
#   - there is no persistent disk, so uploaded resumes are lost on restart

services:
  - type: web
    name: online-job-portal
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Database connection, taken straight from the database defined below.
      - key: DB_HOST
        fromDatabase:
          name: jobportal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: jobportal-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: jobportal-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: jobportal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jobportal-db
          property: password

      # Admin password for the hosted copy. Render generates a random value on
      # the first deploy; read it under the service's Environment tab.
      - key: ADMIN_PASSWORD
        generateValue: true

      # Set to false if you would rather the hosted login page did not list the
      # demo accounts.
      - key: SHOW_DEMO_CREDENTIALS
        value: "true"

      # Keep the JVM inside the free instance's 512 MB.
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC

      # Outgoing email (Section 16 #1), off by default - see application-prod.properties.
      # MAIL_ENABLED is a plain "false"/"true" switch, not a secret, so it is committed
      # with a value like every other setting above. The five SMTP_*/MAIL_FROM values are
      # real credentials and must never be written into this file (hard requirement 1):
      # sync: false makes Render prompt for each one under the service's Environment tab
      # instead, the same way ADMIN_PASSWORD's actual value never appears here either.
      # Flip MAIL_ENABLED to "true" only once all four SMTP_* values are filled in.
      - key: MAIL_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: jobportal-db
    plan: free
    region: singapore
    databaseName: jobportal
    user: jobportal
